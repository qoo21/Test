<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ランキングつなぎ</title>
<style>
:root{--bg:#111114;--surface:#1e1e24;--line:#2b2b33;--fg:#e9e9ee;--muted:#8b8b97;--hi:#f4f4f7;--hi-ink:#111114;--warn:#e8a24a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;font-size:14px;line-height:1.6;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;padding-block:40px}
h1{font-size:18px;margin:0}
p{margin:0;color:var(--muted)}
.drop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:6px;padding:16px}
.drop.over{border-color:var(--hi)}
.drop span{color:var(--muted);font-size:13px}
button{font:inherit;font-size:14px;border-radius:5px;padding:8px 16px;cursor:pointer;background:var(--hi);color:var(--hi-ink);border:1px solid var(--hi);font-weight:700}
button:disabled{opacity:.4;cursor:wait}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{accent-color:var(--hi);width:15px;height:15px;margin:0}
.msg{min-height:1.6em;font-size:13px}
.msg.err{color:var(--warn)}
</style>
</head>
<body>
<main class="lock">
  <h1>ランキングつなぎ</h1>
  <p>使うには鍵ファイル（ranking-key.json）を読み込んでください。</p>
  <div class="drop" id="drop">
    <button type="button" id="pick">鍵ファイルを選ぶ</button>
    <span>またはここにドロップ</span>
  </div>
  <input type="file" id="keyInput" hidden>
  <label class="check"><input type="checkbox" id="remember">この端末で鍵を記憶する</label>
  <p class="msg" id="msg"></p>
</main>

<script>
(() => {
'use strict';
const STORE = 'rk-key-v1';
const $ = id => document.getElementById(id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const say = (t, err) => { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); };

async function unlock(text, remember){
  let key;
  try{ key = JSON.parse(text); }catch(e){ throw new Error('鍵ファイルの形式が正しくありません。'); }
  if(!key || key.type !== 'ranking-tsunagi-key' || typeof key.key !== 'string') throw new Error('このページの鍵ファイルではありません。');
  if(!window.crypto || !crypto.subtle) throw new Error('このブラウザでは開けません（https のページで開いてください）。');
  const ck = await crypto.subtle.importKey('raw', b64d(key.key), 'AES-GCM', false, ['decrypt']);
  const all = b64d($('rk-payload').textContent.trim());
  let plain;
  try{ plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:all.slice(0,12)}, ck, all.slice(12)); }
  catch(e){ throw new Error('この鍵では開けません。別の鍵ファイルではありませんか。'); }
  if(remember){ try{ localStorage.setItem(STORE, JSON.stringify(key)); }catch(e){} }
  const boot = '<script>window.RK_KEYFILE=' + JSON.stringify(key).replace(/</g, '\\u003c') + ';<\/script>';
  const html = new TextDecoder().decode(plain).replace(/<head>/i, '<head>' + boot);
  document.open(); document.write(html); document.close();
}
async function fromFile(f){
  if(!f) return;
  $('pick').disabled = true; say('確認中…');
  try{ await unlock(await f.text(), $('remember').checked); }
  catch(e){ say(e.message, true); $('pick').disabled = false; }
}
$('pick').addEventListener('click', () => $('keyInput').click());
$('keyInput').addEventListener('change', () => fromFile($('keyInput').files[0]));
const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); fromFile(e.dataTransfer.files[0]); });

let saved = null;
try{ saved = localStorage.getItem(STORE); }catch(e){}
if(saved){
  say('記憶した鍵で開いています…');
  unlock(saved, false).catch(e => { try{ localStorage.removeItem(STORE); }catch(_){} say('記憶していた鍵では開けなかったので、記憶を消しました。鍵ファイルを読み込んでください。', true); });
}
})();
</script>
